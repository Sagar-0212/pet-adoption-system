name: GitFlow CI/CD Pipeline to EC2

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    name: Lint & Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      - name: Lint with Flake8
        run: |
          flake8 . --count --max-line-length=120 --statistics --exclude=.git,__pycache__,.pytest_cache

      - name: Run Pytest
        run: |
          pytest test_main.py -v

  deploy-to-ec2:
    name: Deploy to Production EC2
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: SSH Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "Pulling latest code on EC2..."
            cd /home/ubuntu/app
            git pull origin main
            docker build -t pet-adoption-app:latest .
            docker stop pet-adoption-app || true
            docker rm pet-adoption-app || true
            docker run -d --name pet-adoption-app --restart always -p 8000:8000 -p 80:8000 pet-adoption-app:latest
            sleep 4
            curl -f http://localhost:8000/health || exit 1
            docker image prune -f
            echo "EC2 Deployment Successfully Completed!"
